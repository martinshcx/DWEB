<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

<body>
  <h2>Atividade 9</h2>

  <h3>1 e 2) Três números</h3>
  <input type="number" id="n1" placeholder="Número 1">
  <input type="number" id="n2" placeholder="Número 2">
  <input type="number" id="n3" placeholder="Número 3">
  <button onclick="testarMaior()">Testar</button>
  <p id="res1"></p>
  <p id="res2"></p>

  <h3>3) Palíndromo</h3>
  <input type="text" id="texto" placeholder="Digite uma frase">
  <button onclick="testarPalindromo()">Verificar</button>
  <p id="res3"></p>

  <h3>4) Subconjunto</h3>
  <input type="text" id="p1" placeholder="Palavra maior (ex: programação)">
  <input type="text" id="p2" placeholder="Palavra contida (ex: programa)">
  <button onclick="testarSubconjunto()">Verificar</button>
  <p id="res4"></p>

  <h3>5) Dia da semana</h3>
  <input type="date" id="data">
  <button onclick="testarDia()">Descobrir</button>
  <p id="res5"></p>

  <script src="funcoes.js"></script>
